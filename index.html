<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nota de compra - FSA</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#EDEDE9; --card:#FFFFFF; --soft:#F6F5F2; --ink:#3A3733; --ink2:#635C53; --ink3:#9B948A;
    --line:#DAD6CE; --accent:#B4835A; --accent-d:#6B4A2E; --accent-l:#F0E4D6;
    --ok:#2F7A4F; --ok-l:#E3F1E8; --bad:#A5362A; --bad-l:#F6E1DD;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.35;}
  h1,h2,.title-font{font-family:"Space Grotesk",-apple-system,sans-serif;}
  .app{max-width:600px;margin:0 auto;padding:16px 14px 80px;}

  header{display:flex;align-items:center;gap:14px;padding:6px 2px 18px;}
  header img{height:46px;width:auto;display:block;flex:none;}
  header h1{margin:0;font-size:24px;letter-spacing:-0.01em;}
  header p{margin:2px 0 0;font-size:15px;color:var(--ink2);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 16px;margin-bottom:16px;}
  .card h2{margin:0 0 14px;font-size:18px;}

  .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0;}
  .fld > span{font-size:15px;font-weight:600;color:var(--ink2);}
  input,select,output{font:inherit;font-size:18px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:0 12px;min-height:54px;width:100%;}
  select{padding-right:8px;}
  output{display:flex;align-items:center;background:var(--soft);font-weight:700;color:var(--accent-d);font-variant-numeric:tabular-nums;}
  input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px;}
  input::placeholder{color:var(--ink3);}
  .f-desc{text-transform:uppercase;}
  .f-desc::placeholder{text-transform:none;}
  .bad{border-color:var(--bad)!important;background:var(--bad-l)!important;}

  .item{border:1.5px solid var(--line);border-radius:8px;background:var(--soft);padding:14px 12px 2px;margin-bottom:14px;}
  .item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .item-head strong{font-family:"Space Grotesk",sans-serif;font-size:17px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  .single .rm{display:none;}

  button{font:inherit;cursor:pointer;border-radius:8px;min-height:54px;padding:0 18px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:19px;width:100%;}
  .primary:active{background:var(--accent-d);}
  .add{width:100%;border-color:var(--accent);color:var(--accent-d);background:var(--accent-l);}
  .small{min-height:42px;padding:0 12px;font-size:15px;}
  .danger{color:var(--bad);}

  .total-row{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid var(--line);margin-top:6px;padding-top:14px;margin-bottom:14px;}
  .total-row span{color:var(--ink2);font-weight:600;}
  .total-row strong{font-family:"Space Grotesk",sans-serif;font-size:30px;color:var(--accent-d);font-variant-numeric:tabular-nums;}

  .msg{border-radius:8px;padding:14px;margin-bottom:14px;font-weight:600;font-size:17px;}
  .msg.ok{background:var(--ok-l);color:var(--ok);}
  .msg.err{background:var(--bad-l);color:var(--bad);}
  .editing{background:var(--accent-l);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;color:var(--accent-d);}

  .note{border:1.5px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;}
  .note:last-child{margin-bottom:0;}
  .note-top{display:flex;justify-content:space-between;gap:10px;}
  .note-who{font-weight:700;}
  .note-meta{font-size:14px;color:var(--ink3);margin-top:2px;}
  .note-total{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .note ul{margin:10px 0 12px;padding-left:18px;font-size:15px;color:var(--ink2);}
  .note li{margin-bottom:4px;}
  .note-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .empty{color:var(--ink3);margin:0;}
  .hint{font-size:14px;color:var(--ink3);margin:12px 0 0;}

  .overlay{position:fixed;inset:0;background:rgba(32,29,25,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;}
  .overlay[hidden]{display:none;}
  .modal{background:var(--card);border-radius:10px;padding:22px;max-width:380px;width:100%;}
  .modal h2{margin:0 0 8px;font-size:20px;}
  .modal p{margin:0 0 18px;color:var(--ink2);}
  .modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal .del{background:var(--bad);border-color:var(--bad);color:#fff;}
  @media (prefers-reduced-motion:no-preference){ .msg{animation:pop .25s ease-out;} }
  @keyframes pop{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">

  <header>
    <img id="logo" alt="FSA Construtora e Incorporadora">
    <div>
      <h1>Nota de compra</h1>
      <p>Registre aqui a compra feita para a obra.</p>
    </div>
  </header>

  <div id="msg" role="status" aria-live="polite"></div>

  <form class="card" id="form" novalidate>
    <div id="editBar" class="editing" hidden>
      <span id="editText">Editando uma nota</span>
      <button type="button" class="small" id="cancelEdit">Cancelar</button>
    </div>

    <label class="fld"><span>Quem comprou</span>
      <select id="comprador"></select></label>
    <label class="fld"><span>Fornecedor (loja)</span>
      <select id="fornecedor"></select></label>

    <h2 style="margin-top:6px">Itens comprados</h2>
    <div id="items"></div>
    <button type="button" class="add" id="addItem">+ Adicionar outro item</button>

    <div class="total-row"><span>Total da compra</span><strong id="grand">R$ 0,00</strong></div>
    <button type="submit" class="primary" id="submit">Registrar compra</button>
  </form>

  <section class="card">
    <h2>Últimas notas</h2>
    <div id="hist"><p class="empty">Carregando...</p></div>
    <p class="hint" id="histHint" hidden>As notas mais antigas ficam guardadas na planilha.</p>
  </section>
</div>

<datalist id="dl-desc"></datalist>

<div class="overlay" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Excluir esta nota?</h2>
    <p>Ela some da planilha e não dá para desfazer.</p>
    <div class="row">
      <button type="button" id="mCancel">Cancelar</button>
      <button type="button" class="del" id="mOk">Excluir</button>
    </div>
  </div>
</div>

var D = {listas:{compradores:[],fornecedores:[],obras:[],etapas:[],unidades:[]}, descricoes:[], notas:[]};
var editId = null;
var deletingId = null;
var $ = function(id){ return document.getElementById(id); };

/* ---------- utilidades ---------- */
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  var offline = 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  var req;
  if(!API || API.indexOf('http') !== 0){ return Promise.reject(new Error('Endereço do servidor não configurado (arquivo config.js).')); }
  if(fn === 'obterDadosIniciais'){
    req = fetch(API + '?action=init&t=' + Date.now());
  } else {
    var body = fn === 'salvarNota' ? {action:'salvar', payload:args[0]} : {action:'excluir', id:args[0]};
    req = fetch(API, {method:'POST', body:JSON.stringify(body)});
  }
  return req.then(function(r){ return r.json(); }, function(){ throw new Error(offline); })
    .then(function(j){
      if(!j || !j.ok) throw new Error((j && j.erro) || 'Erro inesperado no servidor.');
      return fn === 'obterDadosIniciais' ? j.dados : j;
    }, function(e){ throw (e && e.message === offline ? e : new Error('Resposta inválida do servidor.')); });
}
function brl(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function cleanErr(e){ return String((e && e.message) || e || 'Erro inesperado').replace(/^Error:\s*/,''); }
function showMsg(text, kind){
  $('msg').innerHTML = '<div class="msg ' + kind + '">' + esc(text) + '</div>';
  window.scrollTo({top:0, behavior:'smooth'});
}
function clearMsg(){ $('msg').innerHTML = ''; }
function parseMoney(el){ var d = el.value.replace(/\D/g,''); return d ? parseInt(d,10)/100 : 0; }
function parseQty(el){ var n = parseFloat(String(el.value).replace(',','.')); return isNaN(n) ? 0 : n; }
function maskMoney(el){
  el.addEventListener('input', function(){
    var d = el.value.replace(/\D/g,'').replace(/^0+/,'');
    if(!d){ el.value = ''; return; }
    el.value = (parseInt(d,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  });
}
function fillSelect(sel, arr, placeholder, keep){
  var cur = keep === undefined ? sel.value : keep;
  var html = '<option value="" disabled>' + esc(placeholder) + '</option>';
  arr.forEach(function(v){ html += '<option value="' + esc(v) + '">' + esc(v) + '</option>'; });
  sel.innerHTML = html;
  setSelect(sel, cur);
}
function setSelect(sel, value){
  if(value && !Array.prototype.some.call(sel.options, function(o){ return o.value === value; })){
    var o = document.createElement('option'); o.value = value; o.textContent = value; sel.appendChild(o);
  }
  if(value){ sel.value = value; }
  else if(sel.options.length === 2){ sel.selectedIndex = 1; }
  else { sel.selectedIndex = 0; }
}

/* ---------- itens ---------- */
function newItem(data){
  var wrap = document.createElement('div');
  wrap.className = 'item';
  wrap.innerHTML =
    '<div class="item-head"><strong class="item-title">Item</strong><button type="button" class="small danger rm">Remover</button></div>' +
    '<label class="fld"><span>O que comprou</span><input class="f-desc" type="text" list="dl-desc" autocomplete="off" placeholder="Ex.: alicate universal"></label>' +
    '<div class="grid2">' +
      '<label class="fld"><span>Quantidade</span><input class="f-qtd" inputmode="decimal" value="1"></label>' +
      '<label class="fld"><span>Unidade</span><select class="f-un"></select></label>' +
      '<label class="fld"><span>Valor de cada um</span><input class="f-val" inputmode="numeric" placeholder="0,00"></label>' +
      '<div class="fld"><span>Total do item</span><output class="f-tot">R$ 0,00</output></div>' +
    '</div>' +
    '<label class="fld"><span>Para qual obra</span><select class="f-obra"></select></label>' +
    '<label class="fld"><span>Para qual etapa</span><select class="f-etapa"></select></label>';
  var items = $('items');
  var prev = items.lastElementChild;

  fillSelect(wrap.querySelector('.f-un'), D.listas.unidades, 'Unidade', (data && data.unidade) || 'UN');
  fillSelect(wrap.querySelector('.f-obra'), D.listas.obras, 'Escolha a obra', (data && data.obra) || (prev && prev.querySelector('.f-obra').value) || '');
  fillSelect(wrap.querySelector('.f-etapa'), D.listas.etapas, 'Escolha a etapa', (data && data.etapa) || (prev && prev.querySelector('.f-etapa').value) || '');

  maskMoney(wrap.querySelector('.f-val'));
  var desc = wrap.querySelector('.f-desc');
  desc.addEventListener('blur', function(){ desc.value = desc.value.toUpperCase().trim(); });
  ['input','change'].forEach(function(ev){
    wrap.querySelector('.f-qtd').addEventListener(ev, recalc);
    wrap.querySelector('.f-val').addEventListener(ev, recalc);
  });
  wrap.querySelector('.rm').addEventListener('click', function(){
    if(items.children.length > 1){ wrap.remove(); renumber(); recalc(); }
  });
  wrap.querySelectorAll('select, input').forEach(function(el){
    el.addEventListener('input', function(){ el.classList.remove('bad'); });
  });

  if(data){
    desc.value = data.descricao;
    wrap.querySelector('.f-qtd').value = String(data.quantidade).replace('.',',');
    wrap.querySelector('.f-val').value = data.valorUnitario.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  items.appendChild(wrap);
  renumber(); recalc();
  return wrap;
}
function renumber(){
  var list = $('items').children;
  for(var i = 0; i < list.length; i++){ list[i].querySelector('.item-title').textContent = 'Item ' + (i+1); }
  $('items').classList.toggle('single', list.length === 1);
}
function recalc(){
  var total = 0;
  Array.prototype.forEach.call($('items').children, function(it){
    var t = parseQty(it.querySelector('.f-qtd')) * parseMoney(it.querySelector('.f-val'));
    it.querySelector('.f-tot').textContent = brl(t);
    total += t;
  });
  $('grand').textContent = brl(total);
}

/* ---------- formulario ---------- */
function resetForm(){
  editId = null;
  $('editBar').hidden = true;
  $('submit').textContent = 'Registrar compra';
  $('items').innerHTML = '';
  newItem();
}
function startEdit(nota){
  editId = nota.id;
  $('editBar').hidden = false;
  $('editText').textContent = 'Editando a nota de ' + nota.data + ' às ' + nota.hora;
  $('submit').textContent = 'Salvar alterações';
  setSelect($('comprador'), nota.comprador);
  setSelect($('fornecedor'), nota.fornecedor);
  $('items').innerHTML = '';
  nota.itens.forEach(function(it){ newItem(it); });
  clearMsg();
  $('form').scrollIntoView({behavior:'smooth', block:'start'});
}
function collect(){
  var ok = true, first = null;
  function mark(el){ el.classList.add('bad'); ok = false; if(!first) first = el; }
  var comp = $('comprador'), forn = $('fornecedor');
  if(!comp.value) mark(comp);
  if(!forn.value) mark(forn);
  var itens = [];
  Array.prototype.forEach.call($('items').children, function(it){
    var desc = it.querySelector('.f-desc'), qtd = it.querySelector('.f-qtd'),
        val = it.querySelector('.f-val'), obra = it.querySelector('.f-obra'), etapa = it.querySelector('.f-etapa');
    var q = parseQty(qtd), v = parseMoney(val);
    if(!desc.value.trim()) mark(desc);
    if(!(q > 0)) mark(qtd);
    if(!(v > 0)) mark(val);
    if(!obra.value) mark(obra);
    if(!etapa.value) mark(etapa);
    itens.push({descricao: desc.value.trim().toUpperCase(), quantidade: q,
      unidade: it.querySelector('.f-un').value, valorUnitario: v, obra: obra.value, etapa: etapa.value});
  });
  if(!ok){
    showMsg('Falta preencher os campos em vermelho.', 'err');
    if(first) setTimeout(function(){ first.scrollIntoView({behavior:'smooth', block:'center'}); first.focus(); }, 350);
    return null;
  }
  return {id: editId || '', comprador: comp.value, fornecedor: forn.value, itens: itens};
}

/* ---------- historico ---------- */
function renderHist(){
  var box = $('hist');
  if(!D.notas.length){ box.innerHTML = '<p class="empty">Nenhuma nota registrada ainda. Preencha o formulário acima e toque em Registrar compra.</p>'; $('histHint').hidden = true; return; }
  box.innerHTML = '';
  D.notas.forEach(function(n){
    var total = n.itens.reduce(function(s,i){ return s + i.quantidade * i.valorUnitario; }, 0);
    var el = document.createElement('div');
    el.className = 'note';
    el.innerHTML =
      '<div class="note-top"><div><div class="note-who">' + esc(n.comprador) + ' &rarr; ' + esc(n.fornecedor) + '</div>' +
      '<div class="note-meta">' + esc(n.data) + ' às ' + esc(n.hora) + '</div></div>' +
      '<div class="note-total">' + brl(total) + '</div></div>' +
      '<ul>' + n.itens.map(function(i){
        return '<li>' + esc(i.descricao) + ': ' + String(i.quantidade).replace('.',',') + ' ' + esc(i.unidade) + ' x ' + brl(i.valorUnitario) + '</li>';
      }).join('') + '</ul>' +
      '<div class="note-btns"><button type="button" class="small b-pdf">PDF</button>' +
      '<button type="button" class="small b-edit">Editar</button>' +
      '<button type="button" class="small danger b-del">Excluir</button></div>';
    el.querySelector('.b-pdf').addEventListener('click', function(){ makePdf(n); });
    el.querySelector('.b-edit').addEventListener('click', function(){ startEdit(n); });
    el.querySelector('.b-del').addEventListener('click', function(){ deletingId = n.id; $('modal').hidden = false; });
    box.appendChild(el);
  });
  $('histHint').hidden = false;
}

/* ---------- PDF ---------- */
function makePdf(nota){
  try{
    var doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    var W = doc.internal.pageSize.getWidth();
    try{ doc.addImage(LOGO, 'PNG', 15, 10, 32, 12.5); }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text('NOTA DE COMPRA', W-15, 16, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text(nota.data + ' às ' + nota.hora, W-15, 22, {align:'right'});
    var y = 32;
    doc.setDrawColor(218,214,206); doc.line(15, y, W-15, y); y += 9;
    doc.setFontSize(10.5);
    doc.setFont('helvetica','bold'); doc.text('Comprador:', 15, y);
    doc.setFont('helvetica','normal'); doc.text(String(nota.comprador), 42, y); y += 7;
    doc.setFont('helvetica','bold'); doc.text('Fornecedor:', 15, y);
    doc.setFont('helvetica','normal'); doc.text(String(nota.fornecedor), 42, y); y += 10;

    var cols = [['DESCRIÇÃO',15],['OBRA',70],['ETAPA',100],['QTD',130],['UN',142],['V.UNIT.',153],['TOTAL',174]];
    doc.setFontSize(8); doc.setFont('helvetica','bold');
    cols.forEach(function(c){ doc.text(c[0], c[1], y); });
    y += 2; doc.line(15, y, W-15, y); y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    var total = 0;
    nota.itens.forEach(function(it){
      if(y > 262){ doc.addPage(); y = 20; }
      var t = it.quantidade * it.valorUnitario; total += t;
      var dl = doc.splitTextToSize(String(it.descricao), 52);
      var ol = doc.splitTextToSize(String(it.obra), 28);
      var el = doc.splitTextToSize(String(it.etapa), 28);
      doc.text(dl, 15, y); doc.text(ol, 70, y); doc.text(el, 100, y);
      doc.text(String(it.quantidade).replace('.',','), 130, y);
      doc.text(String(it.unidade), 142, y);
      doc.text(brl(it.valorUnitario), 153, y);
      doc.text(brl(t), 174, y);
      y += Math.max(7, Math.max(dl.length, ol.length, el.length) * 4.2);
    });
    y += 3; doc.line(15, y, W-15, y); y += 10;
    doc.setFontSize(12.5); doc.setFont('helvetica','bold');
    doc.text('VALOR TOTAL: ' + brl(total), W-15, y, {align:'right'});
    y += 28; if(y > 270){ doc.addPage(); y = 30; }
    doc.setDrawColor(100,100,100);
    doc.line(15, y, 95, y); doc.line(W-95, y, W-15, y);
    doc.setFontSize(8.5); doc.setFont('helvetica','normal');
    doc.text('Assinatura do comprador', 15, y+5);
    doc.text('Assinatura do aprovador', W-95, y+5);
    var nome = 'nota_compra_' + nota.data.replace(/\//g,'-') + '_' + String(nota.comprador).replace(/\s+/g,'_') + '.pdf';
    doc.save(nome);
  }catch(e){
    showMsg('Não foi possível gerar o PDF. Tente de novo.', 'err');
  }
}

/* ---------- eventos ---------- */
$('addItem').addEventListener('click', function(){
  var it = newItem();
  it.querySelector('.f-desc').focus();
});
$('form').addEventListener('input', function(){ if($('msg').firstChild) clearMsg(); });
$('cancelEdit').addEventListener('click', function(){ resetForm(); clearMsg(); });
$('comprador').addEventListener('change', function(){
  this.classList.remove('bad');
  try{ localStorage.setItem('fsa_comprador', this.value); }catch(e){}
});
$('fornecedor').addEventListener('change', function(){ this.classList.remove('bad'); });
$('mCancel').addEventListener('click', function(){ $('modal').hidden = true; deletingId = null; });
$('mOk').addEventListener('click', function(){
  var id = deletingId; $('modal').hidden = true; deletingId = null;
  if(!id) return;
  call('excluirNota', id).then(function(r){
    D.notas = r.notas; renderHist();
    if(editId === id) resetForm();
    showMsg('Nota excluída.', 'ok');
  }).catch(function(e){ showMsg(cleanErr(e), 'err'); });
});
$('form').addEventListener('submit', function(ev){
  ev.preventDefault(); clearMsg();
  var payload = collect();
  if(!payload) return;
  var btn = $('submit'), label = btn.textContent, wasEditing = !!editId;
  btn.disabled = true; btn.textContent = 'Salvando...';
  call('salvarNota', payload).then(function(r){
    D.notas = r.notas; renderHist(); resetForm();
    showMsg(wasEditing ? 'Alterações salvas.' : 'Compra registrada.', 'ok');
  }).catch(function(e){
    showMsg(cleanErr(e), 'err');
  }).then(function(){ btn.disabled = false; btn.textContent = editId ? 'Salvar alterações' : 'Registrar compra'; });
});

/* ---------- inicio ---------- */
call('obterDadosIniciais').then(function(r){
  D = r;
  var saved = ''; try{ saved = localStorage.getItem('fsa_comprador') || ''; }catch(e){}
  fillSelect($('comprador'), D.listas.compradores, 'Escolha quem comprou', saved);
  fillSelect($('fornecedor'), D.listas.fornecedores, 'Escolha o fornecedor', '');
  $('dl-desc').innerHTML = D.descricoes.map(function(d){ return '<option value="' + esc(d) + '">'; }).join('');
  resetForm(); renderHist();
}).catch(function(e){
  $('hist').innerHTML = '<p class="empty">Não foi possível carregar. Feche e abra o link de novo.</p>';
  showMsg(cleanErr(e), 'err');
});
</script>
